name: Calculator Test and Deploy

on:
 push:
  branches:
   - main

jobs:
 test:
 runs-on: ubuntu-latest
 steps:
 - name: Checkout code
   uses: actions/checkout@v7
   
 - name: Set up python
   uses: actions/setup-python@v4
    with: 
     python-version:'3.10'
  
 - name: Install dependencies
   run: pip install -r requirements.txt
 
 